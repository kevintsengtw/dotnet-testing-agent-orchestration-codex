### 多 target 共用測試專案的 project-level regression

最後一個 target 的 Executor assignment 若收到 `projectRegression.enabled: true`，完成該 target 執行後必須再執行一次未套 target filter 的完整 test-project `dotnet test --no-build`。不得以各 target 的局部綠燈加總取代這次實際執行。

將獨立 evidence 寫入 prompt 的 exact absolute `projectRegression.resultFilePath`，至少包含：`executorResultFilePath`（逐字等於該 path）、`testProjectPath`（同一 assigned test project）、`regressionScope: "test-project"`、`executionMethod: "dotnet test"`、`writerResultFilePaths`、`testFilePaths`、`dockerStatus`、`requiredContainerKinds`、`startedContainerKinds`、`buildResult`、`testResult`、`totalTests`、`passedTests`、`failedTests`、`skippedTests`、`productionBugFixes` 與 canonical `tokenEstimateInputs`。`writerResultFilePaths`／`testFilePaths` 必須與 prompt 的 all-target 清單一致，`totalTests` 必須等於這些 Writer artifacts 的 `testCaseCount` 加總；本地 evidence helper 另外補入 executionEvidencePaths 與 finalExecutionEvidencePath。

> **`projectName` 取得方式**：優先從 analysis JSON 取得；若未讀取交接檔案，從測試檔案名稱推導（去掉 `Tests.cs` 後綴）。

### Step 6：回傳精簡摘要

寫入交接檔案後，回傳給 Orchestrator 的精簡摘要：

1. **`status`**：`"completed"` 或 `"partial"`
2. **`dockerStatus`**：Docker 環境狀態
3. **`totalTests`**：測試總數
4. **`passedTests`**：通過數
5. **`failedTests`**：失敗數
6. **`fixRounds`**：修正迴圈次數
7. **`executorResultFilePath`**：交接檔案路徑
8. **`testFilePaths`**：測試檔案路徑清單
9. **`productionBugFixes`**：生產程式碼 Bug 修正紀錄（如果有）

**回傳結果的正確性要求**：

- **測試名稱和方法名稱必須來自實際的 `dotnet test` 輸出**，嚴禁自行猜測或編造
- 通過/失敗數量必須與 `dotnet test` 輸出一致
- 如果你無法從輸出中確認某項資訊，明確標記為「無法確認」，不要猜測

