## 修正迴圈規則

1. **最多 3 次迭代** — 超過 3 次仍失敗，停止並回報
2. **每次只修正一類問題** — 不要同時修正多個不相關的錯誤
3. **修正後必須重新建置** — 每次 `Edit` 後都要 `dotnet build` 確認
4. **不修正被測程式碼** — source Bug 或 provider 衝突需要 production 修改時，保留 evidence 並回報 blocked 與 requiresUserApproval；明確授權的 production refactor 另行處理
5. **記錄每次修正** — 在回報中列出修正歷史

---

## 重要原則

1. **Docker 優先檢查** — 有容器需求時，Step 0 是必要步驟，不可跳過
2. **先建置再測試** — 永遠 `dotnet build` 成功後才 `dotnet test --no-build`
3. **低警告等級** — 建置時使用 `-p:WarningLevel=0 /clp:ErrorsOnly` 減少雜訊
4. **不修改 source code** — 只修改測試程式碼；沒有 Program.cs 預授權例外
5. **完整回報** — 包含 Docker 狀態、建置結果、測試結果、修正歷史
6. **容器清理** — 不需要手動清理容器，Testcontainers + `IAsyncLifetime.DisposeAsync` 會自動處理
7. **精確錯誤分類** — 區分「測試碼錯誤」vs「被測碼 Bug」，影響修正策略
8. **超時保護** — 整合測試可能因容器啟動耗時較長，合理設定超時（建議 5 分鐘以上）

## Codex Orchestrator 交接契約

- 執行方式固定為 `dotnet test`。不得使用 `dotnet run`，也不得產生或要求 `<OutputType>Exe</OutputType>`。
- 測試專案必須保留 xUnit 形狀：`Microsoft.NET.Test.Sdk`、`xunit`、`xunit.runner.visualstudio`。
- `containerRequirements` 為空或純 InMemory 時，可在 executor-result 的 `dockerStatus` 記錄 `skipped` 與原因；有容器需求時，Step 0 必須先跑 `docker info`。
- `requiredContainerKinds` 必須由 analysis `containerRequirements` 正規化；有容器需求時 `startedContainerKinds` 必須列出本次測試實際啟動的 container kinds，兩者不得只用對話描述。
- `requiredContainerKinds` 仍只列本 target Analyzer requirements；共享 Factory 額外啟動的 kinds 必須如實列入 `startedContainerKinds`，且只能來自 prompt 的 `allowedSharedContainerKinds[]`。不得把額外 kind 混入 required，也不得省略實際啟動的容器。
- `Cannot connect to the Docker daemon`、`command not found`、`permission denied` 必須各自回報對應環境問題，不得包裝成測試品質問題。
- executor-result 必須寫入 `{testProjectDir}/.orchestrator/executor-result/{ControllerName}.executor-result.json`，且至少包含 `executionMethod`、`dockerStatus`、`buildResult`、`testResult`、`totalTests`、`passedTests`、`failedTests`、`skippedTests`、`fixRounds`、`productionBugFixes`。
- 正式 executor-result 必須包含與 prompt exact canonical path 相同的 `executorResultFilePath`。
- executor-result 必須包含 `tokenEstimateInputs`，完整記錄 readFiles／writtenFiles／toolOutputRefs，供 role read-scope／isolation gate 核對。
- `tokenEstimateInputs` 是正式 workflow 必填契約；缺少 readFiles／writtenFiles、漏列或虛報實際 read／write 時該階段 isolation gate 失敗。
- 正式 Executor 必須接受長度固定為 1 的 `writerResultFilePaths[]`；單數 `writerResultFilePath` 只保留手動向下相容，Orchestrator 不得使用。
- `executorResultFilePath` 由 prompt 指定且必須在 absolute `workspaceRoot`；禁止重新推導 output path。
- `totalTests` / `passedTests` / `failedTests` / `skippedTests` 與測試名稱必須來自實際 `dotnet test` 輸出，不得自行推導或編造。
- `totalTests` 必須等於唯一 Writer 的 `testCaseCount`；`testFilePaths` 必須等於該 Writer artifact。
- productionBugFixes[] 必須為空；不得以 DB Provider 衝突推定 production 修改授權。

