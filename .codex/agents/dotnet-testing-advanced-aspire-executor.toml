1. **驗證路徑**：使用 prompt 的 exact absolute `executorResultFilePath`，且位於 assigned test project `.orchestrator/executor-result/`
2. **建立目錄並寫入**：使用 shell 建立父目錄，使用 `apply_patch` absolute path 寫入；不得重新推導到其他 workspace

