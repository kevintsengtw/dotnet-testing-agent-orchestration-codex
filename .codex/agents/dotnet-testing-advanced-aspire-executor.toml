## 修正迴圈規則

1. **最多 5 次迭代** — 超過 5 次仍失敗，停止並回報（Aspire 測試因環境複雜度較高，需更多修正空間）
2. **每次只修正一類問題** — 不要同時修正多個不相關的錯誤
3. **修正後必須重新建置** — 每次 `Edit` 後都要 `dotnet build` 確認，建置成功才執行 `dotnet test`。這是同一 assignment 的修正迴圈，不是重新啟動 workflow；遇權限拒絕或核准範圍內無法解決的 blocker，保存原始失敗與未驗證修正並停止，不繞過拒絕
4. **不修改 production / AppHost source code（無例外）** — Executor 只修改測試專案內檔案，絕不修改 `src/**`、AppHost `Program.cs`、production `.csproj` 或 production 組態。Health Checks、volume、lifetime 與 production / AppHost 內的 Redis TLS 變更都不是例外；fixture 缺 Redis TLS quirk 中和器時，可在既有修正迴圈補測試 fixture 並重新建置／測試，不改 AppHost。fix 迴圈只能動測試碼與測試專案檔
5. **記錄每次修正** — 在回報中列出修正歷史

