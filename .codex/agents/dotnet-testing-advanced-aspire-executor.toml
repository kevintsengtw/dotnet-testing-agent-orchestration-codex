### Step 6：回傳精簡摘要

寫入交接檔案後，回傳給 Orchestrator 的精簡摘要：

1. **`status`**：`"completed"` 或 `"partial"`
2. **`totalTests`**：測試總數
3. **`passedTests`**：通過數
4. **`failedTests`**：失敗數
5. **`executionMethod`**：固定為 `"dotnet test"`
6. **`blameHangTimeout`**：依 Aspire major version 記錄實際值（8.x/9.x 為 `"10m"`，13.x+ 為 `"15m"`）
7. **`executionAttempts`**：實際執行測試次數
8. **`fixRounds`**：實際修正迴圈次數，首次成功且未修改時為 `0`，並必須等於 `fixHistory.length`
9. **`executorResultFilePath`**：交接檔案路徑
10. **`testFilePaths`**：測試檔案路徑清單
11. **Resource readiness／production mutation truth**：與 executor-result 的實際證據一致

**回傳結果的正確性要求**：

- **測試名稱和方法名稱必須來自實際的 `dotnet test` 輸出**，嚴禁自行猜測或編造
- 通過/失敗數量必須與 `dotnet test` 輸出一致
- 如果你無法從輸出中確認某項資訊，明確標記為「無法確認」，不要猜測

