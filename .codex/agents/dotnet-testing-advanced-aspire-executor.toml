## 錯誤模式對照表

### 建置錯誤

| 錯誤模式 | 原因 | 修正方式 |
|---------|------|---------|
| `CS0246: The type or namespace name 'xxx' could not be found` | 缺少 using 或 NuGet 套件 | 加入 `using` 陳述式或安裝 NuGet 套件 |
| `CS1061: 'xxx' does not contain a definition for 'yyy'` | API 不匹配 | 檢查正確的 API 名稱與簽章 |
| `CS0103: The name 'xxx' does not exist in the current context` | 變數未定義或命名錯誤 | 修正變數名稱 |
| `NU1101: Unable to find package 'xxx'` | NuGet 套件不存在（名稱錯誤） | 修正套件名稱，**優先於所有編譯錯誤處理** |
| `NU1100: Unable to resolve 'xxx'` | NuGet 套件版本無法解析 | 修正版本約束或移除版本限制 |
| `NU1102: Unable to find package 'xxx'` | NuGet 套件名稱錯誤 | 修正套件名稱 |
| `Projects.xxx` 型別不存在 | AppHost 未正確引用目標專案 | 確認 AppHost `.csproj` 的 `ProjectReference` |

### Aspire 特定錯誤

| 錯誤模式 | 原因 | 修正方式 |
|---------|------|---------|
| `DistributedApplicationTestingBuilder` 找不到 | 缺少 `Aspire.Hosting.Testing` 套件 | 安裝 NuGet 套件 |
| `Projects.xxx` 型別不存在 | 程式集名稱含特殊字元未正確轉換 | 使用正確的型別名稱（連字號轉底線） |
| Resource readiness timeout | fixture 就緒缺口或資源／環境故障，須依本次證據分類 | 依 Step 3.5 先核對必要資源及有界確認；測試側缺口在既有修正迴圈補足，仍失敗時保存點名資源與最後原因，不改 production / AppHost |
| `CreateHttpClient` 找不到服務 | 服務名稱或 endpoint 選擇不符 | 依 canonical analysis 修正測試側名稱與 endpoint 選擇；需改 production / AppHost 設定時回報契約外需求 |
| `Cannot open database` | DB schema 未建立 | 在 AspireAppFixture 加入 `EnsureCreatedAsync()` |
| `GET /health` 回傳 404 | 該路由不是已驗證的健康檢查 endpoint | 依實際 API 判斷是否可用其他既有健康檢查，或使用已驗證唯讀路由的協定 fallback；不得新增 production `AddHealthChecks()` 或 `MapHealthChecks("/health")` |
| `GetConnectionStringAsync` 回傳 null | 使用了 `IConfiguration` 而非 Aspire API | 改用 `App.GetConnectionStringAsync("resourceName")` |
| TLS/SSL 憑證錯誤（Redis） | 當次 Redis 套件與 TLS 設定造成就緒或連線不符，依實際 API 查核 | Executor 可在既有最多 5 次修正迴圈補測試 fixture 的 Redis TLS quirk 中和器：可用時在 `BuildAsync()` 前使用 `CreateResourceBuilder(redis).WithoutHttpsCertificate()`（含 `ASPIRECERTIFICATES001` pragma），重新建置／測試；不改 production / AppHost，不依 .NET 版本決定處置 |
| `ContainerLifetime` 未設定 | AppHost sample 採拋棄式容器的預期狀態 | 不列為錯誤或 fixture drift；不得為此修改 production code；持久卷 / 生命週期由測試框架端 sanitizer 通用處理 |

### 測試失敗

| 錯誤模式 | 原因 | 修正方式 |
|---------|------|---------|
| `Assert.Equal() Failure` | 預期值不符 | 檢查預期值與實際回傳值 |
| `Expected status code xxx, but got yyy` | HTTP 狀態碼不符 | 確認 API 行為或調整斷言 |
| `JsonException` | 序列化/反序列化不符 | 修正型別或使用正確的 DTO |
| `TimeoutException` | fixture 有界就緒失敗或資源／環境故障 | 與 Resource readiness timeout 依同一 Step 3.5 分類；先修測試側缺口，保留最後失敗，不由逾時字串直接認定環境故障 |
| `HttpRequestException` | 服務尚未就緒或 endpoint 選擇不符 | 依 canonical analysis 核對測試 fixture 的服務、endpoint 與有界就緒；不修改 AppHost `WaitFor` 設定 |

### Docker / 環境錯誤

| 錯誤模式 | 原因 | 修正方式 |
|---------|------|---------|
| Docker 設定／socket／named pipe 存取遭拒或 `Cannot connect to the Docker daemon` | 權限、設定存取或 daemon 連線故障；不由錯誤字串推定 Docker 未啟動 | 依 Step 0 分類與單次工具核准處置；仍不可用時保留原始原因並停止 |
| `OCI runtime create failed` | Docker 映像拉取失敗 | 檢查網路連線和 Docker 資源配置 |
| `Aspire workload not installed` | .NET Aspire workload 未安裝 | **無法自動修正** — 回報呼叫者 |

