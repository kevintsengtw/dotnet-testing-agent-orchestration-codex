### Windows Docker Desktop／MSSQL 狹義環境例外證據

Executor 不決定是否豁免，也不得為取得例外資格改寫連線目的地／TLS 設定、略過 health check／readiness、變更資料庫行為或改寫失敗 truth。依前述一般修正迴圈補足測試 fixture 的有界就緒不屬於環境豁免；保留每次原始失敗與修正歷史，修正後重新建置／測試，以新執行結果判定。正式測試失敗時，若現場唯一 signature 是 MSSQL 對 `127.0.0.1` 的 TDS pre-login／SQL readiness，仍須保存原始 `testResult: "failed"`、`failedTests > 0` 與 failedTestDetails，並額外收集可由 Orchestrator validator 判讀的 `knownEnvironmentException`。只有完整現場證據可填 `status: "candidate"`；證據不足就省略此物件，不得推測。容器啟動事件或 `Running` 不是 MSSQL 容器內部 ready 的證據；需要的當次日誌應在 fixture 失敗後、資源釋放前保存，不為補取日誌額外啟動測試。

```json
{
  "knownEnvironmentException": {
    "status": "candidate",
    "terminalDecision": "completed_with_known_environment_exception",
    "exceptionCode": "windows_docker_desktop_mssql_127_0_0_1_tds_prelogin",
    "hostOs": "windows",
    "endpointHost": "127.0.0.1",
    "failedTests": 24,
    "failedAssertions": ["原始失敗 assertion／exception 摘要"],
    "evidenceFiles": ["<absolute raw dotnet test/AppHost/Docker/TDS evidence path>"],
