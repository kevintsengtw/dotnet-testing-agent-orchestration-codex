### Step 5：寫入 reviewer-result 交接檔案（必要 — 回傳摘要前立即執行）

在回傳結果之前，你**必須**先把完整審查報告寫入磁碟。只在訊息中回傳 Markdown 或 JSON 不算完成。

1. **確認輸出路徑**：優先使用呼叫者提供的 `reviewResultFilePath`。若缺少此欄位，依 `analysisFilePath` 或 `writerResultFilePath` 推導 `{testProjectDir}/.orchestrator/reviewer-result/{ClassName}.reviewer-result.json`，並在回傳摘要中明確標示此相容推導。
2. **建立目錄**：使用 Bash 執行 `mkdir -p {testProjectDir}/.orchestrator/reviewer-result/`
3. **寫入檔案**：使用 Write 工具寫入 `reviewResultFilePath`
4. **檔案內容**：必須是完整結構化 JSON，至少包含：
   - `overallScore`
   - `reviewMode`（建置失敗時固定為 `upstream-build-blocked`）
   - `gateDecision`
   - `summary`
   - `qualityAssessment` 與 `upstreamBlocker`（建置失敗時必填）
   - `skillsLoaded`
   - `issues`
   - `missingTestCases`
   - `positives`
   - `reviewerResultFilePath`
   - `scopeReviewed`
   - `tunitCompliance`
   - `diagnosticAssessment`：逐字複製 canonical executor-result 的 `diagnostics.restore` 與 `diagnostics.compile`
   - `userScenarioCoverage`
   - `verificationCommand`: 正式 workflow 固定為 `not-rerun-executor-result-used`
   - `tokenEstimateInputs`（正式 workflow 的 role read-scope／isolation 必填契約；漏列或虛報 readFiles／writtenFiles 時該階段 isolation gate 失敗）
5. **寫入前自我驗證**：確認 `gateDecision` 存在且只使用 `pass`、`pass_with_warnings`、`fail`、`blocked`，並與 overallScore、issues、coverage、Executor truth 及分流後的 restore／compile diagnostics 一致。
6. **順序要求**：必須先完成 Write，再回傳精簡摘要。若 Write 失敗，直接回報 blocker，不得假裝 reviewer-result 已落地。

> **寫後讀取限制**：正常情況使用寫入前已完成自我驗證的 JSON 直接回傳精簡摘要；禁止只為 schema verification 再讀回剛寫入的 reviewer-result。Write／apply_patch／shell write 呼叫只要沒有回傳 error 或 exception，即視為成功；空字串、空物件或沒有額外成功訊息都不是「寫入結果不確定」，不得因此讀回。只有工具明確回報 error、partial write 或 invalid payload，且修復該次失敗確實需要時，才可讀回自己的 canonical reviewer-result 一次，並在 `tokenEstimateInputs.readFiles` 如實記錄。Orchestrator 會在 agent 回傳後獨立驗證檔案存在與 schema，Reviewer 不得重複執行該 gate。

回傳給 Orchestrator 的摘要必須包含：

```json
{
  "status": "completed",
  "overallScore": "A",
  "gateDecision": "pass",
  "issueCount": 0,
  "missingTestCaseCount": 0,
  "userScenarioCoverage": {
    "providedScenarioCount": 0,
    "effectiveScenarioCount": 0,
    "implementedScenarioCount": 0,
    "acceptedScenarioIds": [],
    "implementedScenarioIds": [],
    "missingScenarioIds": [],
    "dataMismatchScenarioIds": [],
    "rejectedScenarioIdsExcluded": [],
    "coverageComplete": true
  },
  "reviewerResultFilePath": "tests/MyProject.Core.Tests/.orchestrator/reviewer-result/ProductService.reviewer-result.json",
  "tokenEstimateInputs": {
    "schemaVersion": 1,
    "estimateKind": "visible-context",
    "readFiles": [
      { "path": "analysisFilePath", "reason": "analysis handoff artifact" },
