正式 workflow 的 `tokenEstimateInputs.readFiles` 必須列出 `writerResultFilePath` 的實際 canonical path；不得把字面 placeholder 寫入 artifact。歷史相容陣列存在時才逐筆記錄，並在 notes 標示非正式 workflow input。

