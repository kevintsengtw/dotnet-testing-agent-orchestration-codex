## Step 6.5：自我驗證（寫入前必做）

在產出最終 JSON 之前，執行以下一致性檢查：

1. **頂層 scope 與計數對齊**：artifact `requestedScope` 必須逐欄原樣等於 dispatch payload。class scope 的 `methodsToTest` 列出實際解析出的全部 public methods，Validator 則列實際規則群組，但兩者都只是資訊，不得縮小有效 scenario 集合；constructor guards 以 `methodScenarioCounts.Constructor` 與 catalog `methodName: "Constructor"` 保留。methods scope 必須以 `scopeResolution` 逐一解析 selectors，解析結果聯集等於 `methodsToTest`，所有有效 scenarios 只屬於該聯集。`methodCount` 必須等於輸出 `methodsToTest` 的項目數；`Constructor` 是可出現在 `methodScenarioCounts` 的 pseudo-method，但不列入 class scope 的 `methodsToTest` 或 `methodCount`。`scenarioCount` 必須等於 `scenarioReviewSummary.effective`；再計算 `methodScenarioCounts` 所有值的加總，確認等於 `scenarioCount` 與 `suggestedTestScenarios` 陣列的長度
   - 若不一致：補足遺漏場景，或修正 `methodScenarioCounts` 中的數字，以實際 `suggestedTestScenarios` 為準
2. 確認 `projectContext.targetFramework`、`projectContext.sourceProjectPath`、`projectContext.testProjectPath` 均不為空，且相容性欄位 `projectContext.solutionPath` 為 `null`
3. 確認 `targetClasses[].className` 不為空
   - scope 內每個 `targetClasses[].methods[]` 都有唯一且非空的 `methodIdentifier`，且每個參數都有 boolean `isOptional` 與符合 optional 狀態的 `defaultValueExpression`
4. **Validator 類型額外驗證**：
   - 精簡摘要中包含相容性 metadata `"forbidWriterSplit": true`；正式 topology 已固定為單一 Writer，此欄不得被解讀為 dispatch decision
   - `validatorInfo.validBaseObjectHint` 不為空，且每個有約束的屬性都有對應值
   - `validBaseObjectHint` 中的每個屬性值確實滿足 `rules[]` 中對應的 `validations[]`
5. **Catalog 對齊**：所有有效 catalog 項目的 `normalizedName` 依序完整等於 `suggestedTestScenarios`；`scenarioReviewSummary.effective`、`suggestedTestScenarios.length` 與 `methodScenarioCounts` 加總一致。
6. **使用者情境完整性**：有 `userProvidedScenarios` 時，`rawContent` 不得為空，每一項都必須有 `USR-*` catalog entry；`rejected` 必須使用允許的 reason code 並附證據。
7. **Identifier 合法性**：有效 `normalizedName` 可直接作為 C# method identifier，不得把名稱修復責任留給 Writer。
8. **Attempt isolation**：禁止搜尋、讀取或寫入 prior-attempt、archive、retained、歷史 `.orchestrator` 或 workspace 外部 paths。若意外 read/write，必須回傳 blocked 並在 `tokenEstimateInputs` 如實記錄；刪除誤寫檔案不會恢復本次 attempt 的有效性。
9. **Minimal read scope**：逐筆檢查 `tokenEstimateInputs.readFiles`；source/test project、project context、目前 assigned Analyzer definition、明確 migration input 與必要技術型 Skills 以外的路徑不得存在，尤其禁止其他 `.codex/agents/**` 與 `.codex/skills/dotnet-testing-orchestrator-*/**`。違反時回傳 `analyzer-read-scope-violation`，不得寫成 completed。
10. **Optional parameter default binding**：scope 內每個含 optional 參數的方法至少有一個有效 scenario，其 `optionalParameterDefaultBinding.methodIdentifier` 對應完整方法識別，且 `omittedParameters` 恰好列出該方法全部 optional 參數；明示傳入預設值不算省略。

> 自我驗證失敗時，原地修正 JSON，不要跳過或忽略不一致。

