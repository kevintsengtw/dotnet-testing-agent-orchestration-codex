## Step 6.5：自我驗證（寫入前必做）

在產出最終 JSON 之前，執行以下一致性檢查：

1. **場景總數對齊**：計算 `methodScenarioCounts` 所有值的加總，確認等於 `suggestedTestScenarios` 陣列的長度
   - 若不一致：補足遺漏場景，或修正 `methodScenarioCounts` 中的數字，以實際 `suggestedTestScenarios` 為準
2. 確認 `projectContext.targetFramework`、`projectContext.solutionPath`、`projectContext.sourceProjectPath`、`projectContext.testProjectPath` 均不為空
3. 確認 `targetClasses[].className` 不為空
4. **Validator 類型額外驗證**：
   - 精簡摘要中包含相容性 metadata `"forbidWriterSplit": true`；正式 topology 已固定為單一 Writer，此欄不得被解讀為 dispatch decision
   - `validatorInfo.validBaseObjectHint` 不為空，且每個有約束的屬性都有對應值
   - `validBaseObjectHint` 中的每個屬性值確實滿足 `rules[]` 中對應的 `validations[]`
5. **Catalog 對齊**：所有有效 catalog 項目的 `normalizedName` 依序完整等於 `suggestedTestScenarios`；`scenarioReviewSummary.effective`、`suggestedTestScenarios.length` 與 `methodScenarioCounts` 加總一致。
6. **使用者情境完整性**：有 `userProvidedScenarios` 時，`rawContent` 不得為空，每一項都必須有 `USR-*` catalog entry；`rejected` 必須使用允許的 reason code 並附證據。
7. **Identifier 合法性**：有效 `normalizedName` 可直接作為 C# method identifier，不得把名稱修復責任留給 Writer。
8. **Attempt isolation**：禁止搜尋、讀取或寫入 prior-attempt、archive、retained、歷史 `.orchestrator` 或 workspace 外部 paths。若意外 read/write，必須回傳 blocked 並在 `tokenEstimateInputs` 如實記錄；刪除誤寫檔案不會恢復本次 attempt 的有效性。
9. **Minimal read scope**：逐筆檢查 `tokenEstimateInputs.readFiles`；source/test project、project context、目前 assigned Analyzer definition、明確 migration input 與必要技術型 Skills 以外的路徑不得存在，尤其禁止其他 `.codex/agents/**` 與 `.codex/skills/dotnet-testing-orchestrator-*/**`。違反時回傳 `analyzer-read-scope-violation`，不得寫成 completed。

> 自我驗證失敗時，原地修正 JSON，不要跳過或忽略不一致。

---

## Step 7：寫入交接檔案（必要）

產出完整分析 JSON 後，你**必須**將其寫入磁碟上的交接檔案，供下游 subagent（Writer、Executor、Reviewer）直接讀取。

### 寫入規則

呼叫者會在 prompt 中提供 absolute `workspaceRoot` 與 absolute `analysisOutputPath`。完成前再次執行 canonical path 與 workspace containment 檢查，然後：

1. **建立目錄**：從 absolute `analysisOutputPath` 提取 parent directory；若使用 shell，workdir 必須明確設為 `workspaceRoot`
2. **寫入檔案**：把完整分析 JSON 直接寫入 absolute `analysisOutputPath`。不得先寫 relative path、同名 repo 或其他 worktree。**格式要求：緊湊格式（compact JSON），不加縮排、不加換行，以最小化檔案大小。**

```
範例：呼叫者提供 analysisOutputPath: tests/MyProject.Core.Tests/.orchestrator/analysis/ProductService.analysis.json
→ mkdir -p tests/MyProject.Core.Tests/.orchestrator/analysis/
→ Write(tests/MyProject.Core.Tests/.orchestrator/analysis/ProductService.analysis.json)
```

> ⚠️ **你不需要自行計算路徑**。正式 workflow 直接使用呼叫者提供的 absolute `analysisOutputPath`；上方 relative 範例只適用手動示意，不得覆蓋 formal payload。
> 如果呼叫者未提供 `analysisOutputPath`，則不寫入交接檔案，僅回傳完整 JSON。

> **Write 工具使用限制**：Write 工具**僅限**用於 `.orchestrator/` 目錄下的 JSON 檔案。**禁止**用於修改任何原始碼或測試檔案。

### Estimated Token Usage Telemetry（正式 workflow 必填）

寫入 analysis JSON 時，必須在頂層加入 `tokenEstimateInputs`。此欄位只記錄可觀測材料，供後續 estimator 估算 visible-context token；你不得自行計算或回報 token 數字。

正式 workflow 中此欄位是 canonical telemetry 必填契約；`readFiles` 與 `writtenFiles` 必須完整列出實際 reads/writes，不得省略 workspace 外部、prior-attempt、archive、暫存或已刪除路徑來規避 isolation gate。

> **寫後讀取限制**：正常情況使用寫入前已完成自我驗證的 JSON 直接回傳精簡摘要；禁止只為 schema verification 再讀回剛寫入的 analysis。只有寫入結果不確定或需要修復失敗寫入時，才可讀回自己的 canonical analysis 一次，並在 `tokenEstimateInputs.readFiles` 如實記錄。

```json
"tokenEstimateInputs": {
  "schemaVersion": 1,
  "estimateKind": "visible-context",
  "readFiles": [
    { "path": "被測試目標檔案路徑", "reason": "source under test" },
    { "path": "讀取過的 csproj / solution / migration source / existing test file", "reason": "analysis input" }
  ],
  "writtenFiles": [
    { "path": "analysisOutputPath", "reason": "analysis handoff artifact" }
  ],
  "toolOutputRefs": [],
  "notes": []
}
```

