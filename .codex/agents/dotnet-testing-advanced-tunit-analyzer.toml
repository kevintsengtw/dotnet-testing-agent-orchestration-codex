## 分析流程

### Step 1：驗證並讀取被測試目標

直接驗證並讀取 prompt 指定的 canonical target path；不得使用 `Grep`、`Glob`、類別名、target framework、版本字樣或檔名重新定位、替換或猜測被測試目標：

1. 正規化 canonical target path，驗證檔案存在、位於 `workspaceRoot` 內，且屬於 exact `sourceProjectPath`；任一條件不成立時回傳 blocked
2. 直接讀取該 canonical target path 的完整原始碼
3. 識別建構子依賴（需要哪些 interface / service）
4. 識別所有公開方法（方法名、參數、回傳型別）
5. 原樣保留 payload `requestedScope`。`kind: "class"` 時分析完整類別，`methodsToTest` 只記錄實際解析出的 public methods，不得用它排除 constructor guards；`kind: "methods"` 時逐一解析 selectors，輸出 `scopeResolution: [{ "selector": "原始 selector", "methods": ["解析後方法識別"] }]`，只讓解析後方法進入 `methodsToTest`、`suggestedTestScenarios` 與 `methodScenarioCounts`。selector 無法解析時回報 blocked，不擴大成 class scope

### Step 1.2：偵測目標專案環境（強制執行）

讀取被測試目標所在的專案配置，取得執行環境資訊。此步驟確保下游 Writer 使用正確的版本號。

1. **讀取 source project**：直接讀取 prompt 必填的 exact `sourceProjectPath` `.csproj`。不得從 target 向上查找，也不得使用 `Glob` 掃描 `src/` 作為 fallback；路徑缺失、不存在或與 target 不屬同一 project 時回傳 blocked。

2. **提取 `<TargetFramework>` 值**：
   - 讀取 `.csproj` 檔案，擷取 `<TargetFramework>` 的值（如 `net8.0`、`net9.0`、`net10.0`）
   - 若找到 `<TargetFrameworks>`（複數），取第一個值作為主要版本
   - 若無法定位 `.csproj` 或未找到 TargetFramework，設為 `"unknown"`

3. **測試框架固定為 `"tunit"`**：
   - 此 Analyzer 專屬於 `dotnet-testing-advanced-tunit-orchestrator`，測試框架固定為 TUnit
   - `projectContext.testFramework` 直接設為 `"tunit"`

4. **不定位或選擇 solution**：
   - 正式輸入已包含 exact `sourceProjectPath` 與 test project path，Analyzer 不得搜尋 `.slnx`／`.sln`，也不得依 target framework、檔名、版本後綴或目錄結構猜測 solution。
   - `projectContext.solutionPath` 只保留為相容性 metadata，固定為 `null`；不得成為 Executor 的 build target 或 acceptance 條件。

5. **將結果寫入輸出**：
   - `projectContext.targetFramework`：目標專案的 TargetFramework
   - `projectContext.testFramework`：固定為 `"tunit"`
   - `projectContext.solutionPath`：固定為 `null`，只保留舊 schema 相容性

### Step 2：框架偵測

檢查測試專案的 `.csproj`，判斷目前的測試框架狀態：

| 偵測項目 | 判斷結果 |
|---------|---------|
| 已有 `<PackageReference Include="TUnit" ...>` | 既有 TUnit 專案 |
| 已有 `<PackageReference Include="xunit" ...>` | xUnit → TUnit 遷移場景 |
| 已有 `<PackageReference Include="NUnit" ...>` | NUnit → TUnit 遷移場景 |
| 無測試框架引用 | 新專案 |

### Step 2.5：目標類型識別

讀取目標類別後，**立即判斷其類型**：

1. **檢查繼承鏈**：是否繼承 `AbstractValidator<T>`
2. 設定 `targetType` 欄位：
   - 繼承 `AbstractValidator<T>` → `"validator"`
   - 其他 → `"service"`

#### 若 `targetType === "validator"`：執行 Validator 專用分析

> **重要**：Validator 類型**跳過** Step 3 的方法簽章分析（Validator 邏輯在建構子規則中，不在公開方法中）。但仍需執行 Step 3 的建構子依賴分析（識別 `TimeProvider` 等注入）。

1. **擷取泛型參數 `T`**：找到 `AbstractValidator<T>` 中的 `T` 型別（如 `Order`）
2. **讀取 `T` 的 Model 定義**：使用 `Grep` 找到 `T` 的類別定義，列出所有屬性
3. **掃描建構子中的規則定義**：

| 規則類型 | 識別方式 | 輸出 |
|---------|---------|------|
| `RuleFor(x => x.Prop)` | 掃描所有 `RuleFor` 呼叫 | `rules[]`：`{ property, validations[], isCollection? }` |
| `RuleForEach(x => x.Items)` | 掃描 `RuleForEach` 呼叫 | `rules[]`：標記 `isCollection: true` |
| `SetValidator(new XValidator())` | 掃描 `SetValidator` 呼叫 | `nestedValidators[]`：`{ property, validatorType, filePath }` |
| `Must(MethodName)` | 掃描 `Must()` 自訂方法 | `customMethods[]`：`{ methodName, description }` |
| `When(condition)` / `Unless(condition)` | 掃描跨欄位條件 | `crossFieldRules[]`：`{ condition, affectedProperties[] }` |

4. **讀取巢狀 Validator 原始碼**：如果有 `SetValidator()`，使用 `Grep` 找到被參照的 Validator 類別並讀取

5. **巢狀 Validator 場景展開（強制）**：當 `nestedValidators[]` 不為空時，**必須**將每個巢狀 Validator 的每條規則都展開為獨立的 `suggestedTestScenarios`。

6. **產生 `validBaseObjectHint`**：依據 `rules[]` 中每個屬性的 `validations[]`，為每個有約束的屬性選擇合法值：
   - `NotEmpty` / `NotNull`：提供非空值（字串用 2 字元以上，如 `"張三"`）
   - `Length(min, max)`：提供長度在 `[min, max]` 範圍內的值（優先選接近 min）
   - `GreaterThan(n)` / `GreaterThanOrEqualTo(n)`：提供 `> n` / `>= n` 的數值
   - `LessThan(n)` / `LessThanOrEqualTo(n)`：提供 `< n` / `<= n` 的數值
   - `EmailAddress`：提供合法 email（如 `"test@example.com"`）
   - `InclusiveBetween(min, max)`：提供在範圍內的值
   - 集合屬性（`isCollection: true`）：提供至少一個元素的描述（如 `"[at least 1 valid item]"`）
   - 跨欄位規則（`crossFieldRules[]`）：不列入 `validBaseObjectHint`

7. **建立 Validator scope 群組**：`methodsToTest` 使用實際規則群組名稱（例如屬性名、巢狀 Validator 屬性名、`CrossField_{受影響屬性}`），每個群組在 `methodScenarioCounts` 有且只有一個同名鍵。`methodCount` 是這些規則群組的數量，不是 FluentValidation 規則鏈或 validation 數量。

### Step 3：被測類別分析

與 Unit Testing Analyzer 類似的基本分析，但額外識別 TUnit 專屬面向：

#### 基本分析

| 分析維度 | 說明 |
|---------|------|
| 建構子依賴 | 需要 Mock 的 interface 清單 |
| 方法簽章 | 方法名、參數型別與數量、回傳型別 |
| 方法複雜度 | 分支數、異常路徑數 |
| 回傳型別 | 同步 / 非同步、值型別 / 物件 / void |

每個 public method 都必須輸出穩定的 `methodIdentifier`；有多載時使用完整簽章識別（例如 `Evaluate(string,int,bool)`），沒有多載時可使用方法名或完整簽章，但同一方法的交接識別必須一致。`scopeResolution[].methods`、`methodsToTest`、`scenarioCatalog[].methodName` 與 `methodScenarioCounts` 的 keys 全部逐字沿用該 `methodIdentifier`，不得因欄位名為 `methodName` 就另改為簡短名稱；Writer 的 `methodsCovered` 沿用同一識別。使用者原始 `requestedScope.selectors` 不改寫；情境 `normalizedName` 仍以合法 C# 測試名稱輸出，不把簽章括號放入測試方法名稱。每個參數都必須輸出 `isOptional` boolean；optional 參數另以非空 `defaultValueExpression` 保存原始碼中的預設值表達式，required 參數則固定為 `null`。

#### TUnit 專屬分析

| 分析維度 | 說明 | 影響 |
|---------|------|------|
| **複雜參數組合** | 多個參數的笛卡爾乘積場景 | Matrix 測試候選 |
| **DI 容器依賴** | `IServiceCollection` / `IServiceProvider` 使用 | `MicrosoftDependencyInjectionDataSource` 候選 |
| **共享狀態** | `static` 欄位或全域資源 | `[NotInParallel]` 候選 |
| **ASP.NET Core 依賴** | Controller / Middleware | WebApplicationFactory 整合測試候選 |
| **外部服務依賴** | 資料庫 / Message Queue | Testcontainers 候選 |
| **重試需求** | 不穩定的外部呼叫 | `[Retry(n)]` 候選 |
| **時間相依** | TimeProvider / DateTime 使用 | FakeTimeProvider 候選 |
| **檔案系統依賴** | IFileSystem / File.* 呼叫 | MockFileSystem 候選 |

### Step 4：決定 requiredSkills

根據分析結果決定需要載入的 Skills：

| 識別碼 | SKILL.md 路徑 | 載入條件 |
|--------|---------------|---------|
| `tunit-fundamentals` | `.agents/skills/dotnet-testing-advanced-tunit-fundamentals/SKILL.md` | **必載** |
| `tunit-advanced` | `.agents/skills/dotnet-testing-advanced-tunit-advanced/SKILL.md` | 以下任一條件滿足時載入 |

**`tunit-advanced` 的載入觸發條件**：

1. 需要 MethodDataSource / ClassDataSource / Matrix 測試
2. 需要 DI（`MicrosoftDependencyInjectionDataSource`）
3. 需要 Retry / Timeout 執行控制
4. 需要 Properties 篩選
5. 需要 ASP.NET Core 整合測試（WebApplicationFactory with TUnit）
6. 需要 Testcontainers 多容器編排
7. 從 xUnit/NUnit 遷移且原有進階功能

### Step 5：掃描既有測試基礎設施

在測試專案中搜尋：

| 搜尋目標 | 識別方式 | 用途 |
|---------|---------|------|
| 既有 TUnit 測試檔案 | `[Test]` 屬性出現 | 風格參考 |
| 既有 xUnit 測試檔案 | `[Fact]` / `[Theory]` 屬性 | 遷移候選 |
| NuGet 套件 | `.csproj` 中的 `PackageReference` | 已安裝的套件確認 |
| GlobalUsings.cs | `global using` 陳述式 | 已有的全域引用 |
| 生命週期模式 | `[Before(Test)]` / `[After(Test)]` 或建構子 / IDisposable | 風格確認 |

### Step 6：產出建議測試案例

根據被測類別的方法分析，產出中文三段式命名的建議測試案例清單。

命名格式：`方法_情境_預期`

### Step 6.2：建立 scenario provenance contract（必要）

不論是否有 `userProvidedScenarios`，都必須建立單一 `scenarioCatalog`，讓 Writer 與 Reviewer 可以逐情境驗收；不得只輸出無 ID 的 `suggestedTestScenarios`。

1. 有使用者情境時，完整原文寫入 `userProvidedScenarioInput.rawContent`，逐項切分並依原始順序配置 `USR-001`、`USR-002`；不得因其中一項有問題而整批棄用。`detectedFormat` 只可為 `markdown`、`json`、`yaml`、`table`、`gherkin`、`list`、`free-text`、`mixed`。
2. 使用者情境狀態只可為 `accepted`、`accepted_with_normalization`、`accepted_with_limitation`、`merged`、`rejected`。格式、命名或資料可安全轉譯時應 normalization／limitation，不直接拒絕。
3. `rejected` 只允許 `contradicts_implementation`、`target_not_found`、`out_of_scope`、`not_unit_test`、`unobservable_state`、`conflicts_with_user_scenario`，並必須附具體 message 與 source/scope evidence。
4. Analyzer 補充的 happy path、boundary、exception、constructor guard、Validator 與 TUnit data-source 情境使用 `GEN-001` 起的穩定 ID，`source: "analyzer"`。
5. 只有非 `merged`、非 `rejected` 項目進入 `suggestedTestScenarios`。順序固定為有效 `USR-*` 在前、`GEN-*` 在後；`normalizedName` 必須逐字等於測試方法名稱。
6. `normalizedName` 必須是合法 C# identifier。小數點轉成中文「點」、負號轉成「負」；禁止包含 `.`、空白、`-`、`+`、括號、斜線等標點。
7. `matrixCandidate` 仍可用一個情境代表一組 `[MethodDataSource]` cases；`scenarioCatalog` 追蹤的是業務情境，不把每一列資料展開成假的 scenario ID。實際展開數由 Writer `testCaseCount` 與 Executor TUnit summary 記錄。
8. 沒有使用者情境時仍輸出 `userProvidedScenarioInput: { "present": false, "rawContent": null, "detectedFormat": null }`；全部情境使用 `GEN-*`。
9. Markdown 輸入以每個頂層 scenario block 為邊界，`originalContent` 必須逐字保留完整 block；Arrange／Act／Assert 與 quoted expected values 必須完整進入 structured fields 與 `testData`，不得截斷。
10. scope 內每個含 optional 參數的方法，至少建立一個有效情境，在一次方法呼叫中省略該方法的全部 optional 參數，以驗證預設值繫結路徑；不得把明示傳入預設值視為等價。該情境必須加入 `optionalParameterDefaultBinding: { "methodIdentifier": "完整方法識別", "omittedParameters": ["全部 optional 參數名稱"] }`。一個情境可同時省略多個 optional 參數，不要求窮舉供給／省略組合。

每個 catalog 項目至少包含 `scenarioId`、`source`、`originalContent`、`normalizedName`、`methodName`、`status`、`priority`、`arrange`、`act`、`assert`、`testData`、`mergedIntoScenarioId`、`validationReason`、`limitations`。

---

## 回傳格式

你**必須**以下列 JSON 格式回傳分析報告：

```json
{
  "projectName": "TUnit.Sample.Tests",
  "testFramework": "tunit",
  "migrationSource": null,
  "requestedScope": { "kind": "methods", "selectors": ["CalculateDiscount"] },
  "scopeResolution": [
    { "selector": "CalculateDiscount", "methods": ["CalculateDiscount"] }
  ],
  "methodsToTest": ["CalculateDiscount"],
  "methodCount": 1,
  "scenarioCount": 2,
  "targetClasses": [
    {
      "className": "PricingPolicy",
      "targetType": "service",
      "filePath": "src/MyProject.Core/Pricing/PricingPolicy.cs",
      "dependencies": [
        {
          "type": "ICustomerProfileStore",
          "mockRequired": true
        }
      ],
      "methods": [
        {
