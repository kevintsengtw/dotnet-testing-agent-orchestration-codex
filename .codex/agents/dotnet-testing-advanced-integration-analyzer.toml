## Step 6.5：自我驗證（輸出前）

在寫入交接檔案前，執行以下 sanity check：

1. **scenarioCount 加總比對**：`suggestedTestScenarios` 陣列長度 = 所有端點 scenario 加總（若有 validatorInfo，驗證相關 scenario 也已納入）
2. **必填欄位不為空**：`projectContext.testProjectPath`、`projectContext.solutionPath`、`requiredSkills`（非空陣列）
3. **containerRequirements 一致性**：依 Step 3.2 的本次端點、測試 host 與使用者需求判定，`purpose`／`evidence`、`dbRegistrationAnalysis` 與 `requiredSkills` 不得矛盾；偵測到套件或註冊本身不構成容器需求
4. **validatorInfo 完整性**（若有）：每個 validator 必須有 `validBaseObjectHint`，且 `validBaseObjectHint` 的屬性數量 ≥ 1
5. **existingTestInfrastructure 已確認**：若掃描後無既有設施，`webApiFactory: null`，不要留空物件
6. **scenario provenance**：`endpointCatalog` 與 `endpointsToTest[].endpointId` 完全一致；`scenarioCount`、有效 `scenarioCatalog`、`suggestedTestScenarios` 與 `scenarioReviewSummary.effective` 相等。
7. **artifact identity 與端點計數**：`analysisFilePath` 必須逐字等於 prompt 的 exact absolute `analysisOutputPath`；`endpointCount` 必須等於 `endpointCatalog.length` 與 `endpointsToTest.length`。
8. **tokenEstimateInputs read-scope／isolation 契約**：正式 workflow 必須完整列出實際讀取的 API project、Program.cs、Controller、DTO／Validator／DbContext、test project、必要技術型 Skills、既有測試基礎設施檔案，以及所有實際 writes。`readFiles`／`writtenFiles` 漏列或虛報時回傳 blocked，不得宣稱 isolation gate 通過。

若發現任何項目不一致，修正後再進入 Step 7。正式 workflow 不接受缺少或虛報 readFiles／writtenFiles 的 artifact；role read-scope validator 必須逐項驗證成功。

