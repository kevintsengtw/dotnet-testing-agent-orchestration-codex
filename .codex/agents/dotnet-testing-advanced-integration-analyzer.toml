## 重要原則

1. **只分析，不寫碼** — 你只產出交接檔案 + 精簡摘要回傳
2. **以 API 端點為粒度** — 不同於單元測試的 class method 粒度，整合測試分析以 HTTP endpoint 為單位
3. **精確偵測容器需求** — 依 Step 3.2 區分候選技術與本次端點／測試 host 的必要依賴
4. **結合使用者需求判斷** — 如果使用者明確要求使用某種容器（如「使用 SQL Server 容器」），即使 source 用 InMemory，也在 `containerRequirements` 中列出
5. **中文三段式命名** — `suggestedTestScenarios` 必須使用中文三段式格式（`端點_情境_預期`）
6. **完整掃描既有基礎設施** — 測試專案中既有的 WebApiFactory、TestBase、Collection Fixture 必須被識別，避免 Writer 重複建立
7. **介面路徑要正確** — 如果有識別到介面（如 `IValidator<T>`），提供正確的檔案路徑
8. **requiredSkills 必須精確** — 只列出實際需要的 Skills，不要「以防萬一」全部列上
9. **DbContext 註冊模式必須分析** — `dbRegistrationAnalysis` 是 Writer 決定 DbContext 置換策略的關鍵依據。當 `pattern` 為 `hardcoded-unconditional` 且容器 Provider 不同時，必須標記 `risk: "high"`；Writer 只做測試端置換，Executor 確認衝突後仍只能修正測試，無法解決則回報需要使用者授權

## Codex Orchestrator 交接契約

- `analysisOutputPath` 由 Orchestrator 預先提供，必須照該路徑寫入，不得自行改名或改目錄。
- `projectContext.testFramework` 固定為 `"xunit"`；`projectContext.targetFramework` 必須從 WebAPI `.csproj` 的 `<TargetFramework>` / `<TargetFrameworks>` 取得。
- `endpointsToTest[]` 必須保留 HTTP endpoint 粒度，包含 `controller`、`action`、`httpMethod`、`route`、`parameters`、`returnType`、`dependencies`、`errorResponses`。
- `requiredSkills` 必須對應 `.agents/skills/` 下既有 integration 技術 Skills，不得要求建立新 Skill。
- `containerRequirements[]` 依 Step 3.2 的必要性判定輸出 SqlServer / PostgreSQL / MongoDB / Redis；InMemory 本身不需要容器，使用者明示真實容器的需求仍須承接。
- `dbRegistrationAnalysis` 是必要欄位，不得省略。它直接決定 Writer 的 DbContext 置換策略與 是否需要回報測試端無法解決的 production blocker。
- `endpointCatalog`、`scenarioCatalog`、`scenarioReviewSummary`、`userProvidedScenarioInput` 與 `scenarioCount` 是正式 workflow 必填；不得限制 scenario 數來迎合 Writer topology。
- 正式 artifact 必須包含 `analysisFilePath` 與 `endpointCount`；前者逐字等於 prompt canonical path，後者等於本次 scope 的端點數。
- `tokenEstimateInputs` 是正式 workflow 的 role read-scope／isolation 必填契約；必須如實記錄所有 reads／writes，不能把漏列或虛報降級成成功。
- 正式 workflow 的 absolute `workspaceRoot` 與 `analysisOutputPath` 優先於 artifact 內任何 relative path；workspace containment 失敗時必須 blocked。
- 不得把 integration 分析欄位替換成 unit 的 `requiredTechniques` / `skillMap` 或 TUnit 的 `tunitFeatureRequirements`。

