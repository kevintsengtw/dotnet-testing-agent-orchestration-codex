## 審查面向

### 4a. 命名規範審查

依據 **test-naming-conventions** Skill 審查：

| 檢查項目 | 規則 | 範例 |
|---------|------|------|
| 測試類別命名 | `{Controller}Tests` | `ProductsControllerTests` |
| 測試方法命名 | 中文三段式 `端點操作_情境_預期` | `Create_名稱為空_應回傳400ValidationProblemDetails` |
| 方法命名語意 | 情境與預期必須明確、具體 | ❌ `Create_失敗_回傳錯誤` → ✅ `Create_名稱為空_應回傳400ValidationProblemDetails` |
| 測試資料夾結構 | 一個 Controller 對應一個測試類別 | `ProductsControllerTests.cs`、`OrdersControllerTests.cs` |

### 4b. 斷言品質審查

依據 **awesome-assertions-guide** + **webapi-integration-testing** Skill 審查：

| 檢查項目 | 規則 |
|---------|------|
| 使用 AwesomeAssertions | 不可使用 `Assert.Equal()`、`Assert.True()` 等 xUnit 原生斷言 |
| HTTP 狀態碼斷言 | 必須使用 AwesomeAssertions.Web 專用擴充方法：`.Be200Ok()`、`.Be201Created()`、`.Be204NoContent()`、`.Be400BadRequest()`、`.Be404NotFound()`、`.Be409Conflict()` 等。不得使用不存在的 `.HaveStatusCode(HttpStatusCode.X)` |
| ProblemDetails 完整驗證 | 驗證 `Status`、`Title`，並視情況驗證 `Detail`、`Errors` |
| ValidationProblemDetails | 驗證 `Errors` 字典中的欄位名與錯誤訊息 |
| 複合欄位驗證錯誤 | 多欄位同時驗證失敗的測試必須驗證每個欄位的 **key 存在性 + 錯誤訊息內容**，不得僅檢查 key 存在 |
| 邊界 Happy Path 回應體 | 邊界值 Happy Path 測試（如 201 Created）必須使用 `.And.Satisfy<T>()` 驗證回應體資料，不得僅驗證 status code |
| 集合斷言 | 使用 `.Should().HaveCount(n)` 或 `.Should().ContainSingle()` 等 |
| Null 安全斷言 | 使用 `.Should().NotBeNull()` 後再存取屬性（使用 `!` 運算子） |

### 4c. 測試結構審查

| 檢查項目 | 規則 |
|---------|------|
| AAA 模式 | 每個測試方法必須清晰區分 Arrange / Act / Assert |
| Collection Fixture | 依容器共享範圍安排 fixture 與平行策略，確保測試互不污染；collection 名稱不是固定門檻 |
| WebApplicationFactory | 透過適合被測入口型別的 WebApplicationFactory 建立真實測試 Host，Factory 名稱可依專案調整 |
| HttpClient 取得方式 | 必須使用 `factory.CreateClient()`，不可 `new HttpClient()` |
| 測試隔離 | 每個測試獨立，不依賴其他測試的執行順序 |
| async/await | 整合測試必須使用 `async Task` 回傳型別 |

### 4d. 程式碼品質審查

| 檢查項目 | 規則 |
|---------|------|
| unused using | 不可有未使用的 `using` 陳述式 |
| System.Net.Http.Json | HTTP 請求使用 `PostAsJsonAsync`、`ReadFromJsonAsync` 等 |
| 硬式編碼 | 避免不必要的 magic number / magic string |
| 重複程式碼 | 相同設定邏輯應抽取到 TestBase 或 helper method |
| Dispose 模式 | 確認 `HttpClient`、Factory 的生命週期正確管理 |
| Factory 封裝性 | 初始化、資料重設及釋放順序清楚，避免測試間污染或競態；公開 helper 的可見性依實際用途判斷，不要求唯一方法位置 |

### 4e. 容器管理審查（條件性）

當測試使用 Testcontainers 時額外審查：

| 檢查項目 | 規則 |
|---------|------|
| 容器共享 | 使用 Collection Fixture 共享容器，避免每個測試類別啟動新容器 |
| IAsyncLifetime | 以適合測試框架版本的 async fixture 生命週期管理容器，確保啟動完成及可靠釋放；IAsyncLifetime 為參考做法 |
| DbContext／provider 置換 | 依實際 hosting model、DI 註冊順序及 Executor evidence 判斷隔離；ConfigureServices 與 ConfigureTestServices 均可採用。確認測試服務沒有混用原 provider、連線指向測試資源、fixture 初始化與釋放可靠。不要求唯一 descriptor 移除形狀，也不授權修改 Program.cs |
| Container 初始化 | 容器與資料庫就緒後才執行測試；依實際初始化順序審查 nullable 與欄位設計，不強制唯一初始化形狀 |
| 資料庫清理 | 根據載入的 SKILL.md 選擇清理策略：`webapi-integration-testing` / `aspire-testing` SKILL → DatabaseManager + Respawn；`testcontainers-database` SKILL → `ExecuteSqlRaw("DELETE FROM ...")` 手動清理。多表時須按 FK 順序清理 |
| WaitStrategy | 容器必須有適當的健康檢查等待策略，**不得**使用 `Task.Delay()` 硬式等待 |
| 容器映像標籤 | 應使用固定版本標籤（如 `2022-latest`），避免 `latest` 造成不穩定 |
| 目錄結構 | 測試、fixture 與共用邏輯易於辨識；可依專案慣例安排目錄 |
| IntegrationTestBase | 共用 Factory/Client/Seed/Cleanup 有清楚的責任與生命週期，可使用基底類別或組合 |
| UseEnvironment | 測試 host 設定與環境符合被測管線需要，依 evidence 確認不連到 production 資源；Testing 名稱為參考 |

### 4f. 覆蓋率審查

| 檢查項目 | 規則 |
|---------|------|
| 端點覆蓋 | 每個 API 端點至少有一個 Happy Path 測試 |
| 建構子防禦測試 | 若建構子有 null guard（`?? throw new ArgumentNullException`），是否每個有 null guard 的參數都有對應的防禦測試 |
| 錯誤路徑覆蓋 | 每個可能回傳 4xx/5xx 的情境都有對應測試 |
| Validation 覆蓋 | 對照來源規則、`validatorInfo.validators[].rules[].branches[].scenarioIds` 與 Writer evidence；來源規則即使未列入 Analyzer 對照，仍須如實記錄缺口 |
| 適用端點覆蓋 | 共用規則的本次範圍內端點都須有對應測試行為；依規則與分支判斷，不要求測試方法數量相等，允許 Theory 或合併案例 |
| 條件驗證分支 | 依實際條件確認生效與略過分支；例如 `!string.IsNullOrEmpty(...)` 的 null 與空字串都須有證據。映射到同一情境時，實際測試仍須執行對應輸入，不得僅因 scenarioId 存在即視為涵蓋 |
| 邊界情境 | 空集合、null 值、不存在的 ID 等邊界情境 |
| 遺漏端點 | 比對 Controller 的所有 Action 與測試涵蓋情況 |

### 4g. 跨檔案一致性（Multi-Writer 分割時）

> ℹ️ 當測試由多個 Writer 分割產出時，檢查以下跨檔案一致性項目。若只有單一 Writer，可略過此步驟。

- [ ] `FakeTimeProvider` 欄位命名是否跨檔案一致（應統一為 `_timeProvider`，禁止混用 `_fakeTimeProvider`）
- [ ] 例外斷言方法是否跨檔案一致（應統一使用 `.Throw<T>()`，禁止混用 `.ThrowExactly<T>()`）
- [ ] lambda 委派宣告是否跨檔案一致（應統一使用 `var act = () =>`，禁止混用 `Action act = () =>`）
- [ ] 物件比較斷言是否跨檔案一致（應統一使用 `BeEquivalentTo()` 或屬性逐一斷言，不得混用）
- [ ] `using` 排列順序和組織方式是否跨檔案一致

