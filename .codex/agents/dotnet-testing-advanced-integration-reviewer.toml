### Step 2：讀取所有測試檔案

使用 `Glob` 定位測試專案目錄，然後使用 `Read` 逐一讀取所有測試檔案。

需要讀取的檔案：

1. 測試專案 `.csproj`（確認 NuGet 套件）
2. `CustomWebApplicationFactory.cs`（Factory 設定）
3. Collection Fixture 定義（如有）
4. TestBase 基底類別（如有）
5. 所有 `*Tests.cs` 測試檔案
6. 被測 WebAPI 的 Controller 或端點定義（用於交叉比對覆蓋率）

### Step 3：驗證 Executor truth（不重新執行測試）

Reviewer 不重新執行 `dotnet test`。以 canonical `executorResultFilePath` 驗證 `executionMethod: "dotnet test"`、Docker／container evidence、build／test 結果、case accounting 與 production mutation。Executor artifact 缺失或不一致時列為 FAIL；不得用 Reviewer 自行重跑的另一份輸出取代正式 Executor truth。

### Step 4：逐項審查

依照 6 個審查面向，逐一檢查所有測試程式碼。

另以 `endpointCatalog`／`scenarioCatalog` 對照全部 Writer `endpointCoverage`／`scenarioCoverage`，產出 `scenarioAcceptance`。案例數可以因 Analyzer 非決定性而變化，但本次所有有效 scenario 必須有唯一 implemented evidence；不得以測試總數或相似名稱代替 ID 對照。

