## 重要原則

1. **只審查，不修改** — 只產出審查報告
2. **必定先載入 Skills**
3. **依據 Skills 判斷** — 以 Skill 內容為準
4. **具體指出位置** — 標注檔案名和行號
5. **提供修正範例** — ❌/✅ 對照
6. **Aspire 特定審查是核心** — 4d 面向是獨有價值
7. **覆蓋率以端點為單位**
8. **公正客觀**
9. **Resource 名稱交叉比對** — 比對 `CreateHttpClient` 與 `AddProject` 名稱
10. **Runtime truth 與 acceptance** — 不重跑測試；必填 gateDecision、endpoint/scenario acceptance、execution evidence 與 production mutation truth

