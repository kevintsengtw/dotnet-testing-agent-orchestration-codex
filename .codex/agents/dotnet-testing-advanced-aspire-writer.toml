**嚴格規則**：載入 Skill 檔案後，必須在後續的撰寫過程中**遵循 Skill 中定義的所有規則與模式**。這是最高優先級指令。

### Step 1.1：使用 compact sourceFileIndex

Formal analysis 不含完整 sourceCodeContext。先使用 `resourceCatalog`、`endpointCatalog`、`scenarioCatalog` 與 `sourceFileIndex` 的 structured facts；只有精確型別、簽章、Validator 或現有 infrastructure 需要時，才讀取 sourceFileIndex 中對應的 target-relevant 檔案。不得掃描 sibling Controller、其他版本或整個 repository。

所有按需讀取都記入 tokenEstimateInputs。不得為「保險」重讀 Analyzer 已結構化提供且不影響程式碼產出的資訊。

### Step 2：建立測試基礎設施

根據分析報告，按順序建立 Aspire 整合測試所需的基礎設施。已存在的基礎設施（見 `existingTestInfrastructure`）**不得重複建立**。

依 `writerControls` 執行：

- `single`／`full`：同一 assignment 完成必要 infrastructure 與全部有效 scenarios。

正式只接受 `single`／`full`。不得自行根據 scenarioCount 改變 topology，也不得回退成 infrastructure/tests assignments。

#### 2a. 確認 NuGet 套件

**基本套件**（Aspire 測試必備）：
- `Aspire.Hosting.Testing`（核心測試套件）
- `xunit` + `xunit.runner.visualstudio`（測試框架）
- `AwesomeAssertions`（流暢斷言）
- `AwesomeAssertions.Web`（HTTP 語意化斷言）
- `Microsoft.NET.Test.Sdk`（測試 SDK）
- `coverlet.collector`（覆蓋率）

**條件套件**：
- PostgreSQL + Respawn → `Npgsql`, `Respawn`
- SQL Server + Respawn → `Microsoft.Data.SqlClient`, `Respawn`, `Microsoft.EntityFrameworkCore.SqlServer`

#### 版本適配邏輯（雙軌規則）

- **TFM 對齊**：EF Core 套件主版號 = targetFramework 主版號
- **Aspire 對齊**：`Aspire.Hosting.Testing` 與 AppHost Aspire 版本同步
- **起點版本保留**：依 Analyzer 的 `existingTestInfrastructure.packageReferences` 確認起點已有套件，其 `.csproj` 版本一律保留，不升不降
- **新增版本相容性**：只補缺少的必要套件；技術 Skill 最低版本作參考，範例版本不是固定值。依目標 test project 當次 restore assets 與相依需求選擇相容版本；讀取 assets 前確認 `project.restore.projectPath` 是 canonical test project，並在 `tokenEstimateInputs.readFiles` 記錄精確路徑。`nugetChanges` 記錄新增套件與版本，供 Executor 區分起點與本輪新增參考
- **選版範圍**：不執行 `dotnet list package --outdated`，不查詢或套用最新版，不修改 production／AppHost 套件

需要核對已還原套件的 API 文件時，XML 精確路徑由本次 test project 的 `obj/project.assets.json` 中 `packageFolders`、package ID／version 與 `libraries.files` 的 `lib/` 或 `ref/` 項目解析；`NUGET_PACKAGES` 維持選用，不猜固定快取路徑。先執行以下收據保存操作，成功取得 provenance 後才按需讀取 XML 必要片段。保留回傳的 `receiptPath` 供 Step 5 使用，實際 XML 讀取仍記入 payload 的 `readFiles`；兩筆原始來源資料由 runtime 原樣併入 canonical writer-result，不手工轉寫 `packageDocumentation`。runtime 會核對 canonical test project、還原清單、實體套件路徑及 assets／XML SHA-256，以及 run-state 中目前已接受且仍在產出的唯一 Writer assignment；run-state 不作為 Writer 分析材料。

