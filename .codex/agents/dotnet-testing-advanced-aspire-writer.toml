## 撰寫規則

### Rule 1：AAA 模式
### Rule 1.5：程式碼組織

使用 `#region 方法名稱` / `#endregion` 組織測試方法群組（按被測試方法分組），不使用 `//-----` 註解分割線。每個 region 對應一個被測試方法的所有測試案例。

### Rule 2：中文三段式命名
### Rule 3：使用 AwesomeAssertions

HTTP 回應斷言必須使用 AwesomeAssertions.Web 的專用擴充方法：

```csharp
response.Should().Be200Ok();
response.Should().Be201Created();
response.Should().Be404NotFound();
// ❌ 錯誤：response.Should().HaveStatusCode(HttpStatusCode.OK);
```

`GlobalUsings.cs` 必須包含：

```csharp
global using Aspire.Hosting;
global using Aspire.Hosting.Testing;
global using AwesomeAssertions;
global using AwesomeAssertions.Web;
```

### Rule 4：使用 DistributedApplicationTestingBuilder
- **絕對不要**使用 `WebApplicationFactory`
- **絕對不要**使用 Testcontainers 程式化容器
- **絕對不要**修改 production / AppHost（包含 Health Checks、Redis TLS、volume、lifetime）
- `CreateAsync<T>()` 後、`BuildAsync()` 前，AspireAppFixture 必須執行通用持久化 sanitizer：以 annotation 層級、與服務型別無關的方式剝除容器資源的持久具名資料卷掛載，並強制 ephemeral / session-scoped 生命週期。9.x / 13.x 使用 typed 形式；8.2.x 若無法 typed 存取 `appHost.Resources` / annotation 型別，採 reflection fallback（以 annotation 型別名稱字串比對 `ContainerMountAnnotation` / `ContainerLifetimeAnnotation`）達成相同意圖。若目標 Aspire 版本缺少對應 annotation 型別，sanitizer 可退化為 no-op，但意圖必須保留。
- `CreateAsync<T>()` 後、`BuildAsync()` 前，Aspire 13.1+ 且 AppHost 使用 Redis 時，AspireAppFixture 必須執行 Redis TLS quirk 中和：對每個 Redis resource 使用 `appHost.CreateResourceBuilder(redis).WithoutHttpsCertificate()`，並以 `#pragma warning disable ASPIRECERTIFICATES001` / restore 包住。依當次 Redis 套件、TLS 設定與實際可用 API 判斷；不依 .NET target framework 決定是否產生，不對沒有此行為或 API 的套件強加此段。

### Rule 5：Collection Fixture 共享 AppHost
- 必要資源集合固定為已驗證 analysis 的 `resourceCatalog[].requiredForTarget === true` 加上 `targetServiceName`，包含 AppHost 啟動相依資源；不得因 Controller 未直接使用就排除，也不擴大到未標示必要的資源。 writer-result 既有 notes 記錄各資源的確認方式及實作檔案，供 Executor 依實際執行建立就緒證據。
- AspireAppFixture 必須在 `CreateAsync` 前建立一個總逾時 `CancellationTokenSource(TimeSpan.FromSeconds(90))`；`CreateAsync`、`BuildAsync`、`StartAsync`、資源等待、取得連線字串、協定就緒、重試退避與 schema／Respawn 初始化共用此期限，將同一 `CancellationToken` 傳給可取消的 API；不接受 token 的非同步初始化（例如 `Respawner.CreateAsync`）仍須以共用 token 限制等待（例如 `WaitAsync(ct)`）。等待取消不代表底層作業已停止；取消後停止初始化，處理尚未完成作業的失敗與連線釋放，不為每個資源或重試重新計時。`StartAsync` 後對必要資源集合做有界 readiness 等待。
- 依 Analyzer 的 runtime 套件版本與當次已還原套件的 API 判定能力，不依 .NET target framework 或 AppHost SDK 版本猜測。文件查驗與尚未還原新增套件的 API 驗證依 Step 2a 辦理。可用且有實際健康檢查時使用 `ResourceNotificationService.WaitForResourceHealthyAsync(name, ct)`。缺少 healthy API，或資源沒有實際健康檢查時，`WaitForResourceAsync(name, KnownResourceStates.Running, ct)` 只確認啟動；fallback 必須接續依 `resourceCatalog` 型別與測試實際用途的協定就緒確認，writer-result 記錄 fallback 原因與確認方式。HTTP API 的 fallback 在 fixture 初始化完成前，以共用 `CancellationToken` 對本次已驗證的唯讀路由取得實際 HTTP 回應，依端點契約判定是否就緒；`CreateHttpClient` 與第一個測試案例的呼叫不能取代此確認。不得把只有 `Running` 的證據當成實際可用。
- SQL Server fallback 必須透過 `App.GetConnectionStringAsync(resourceName, ct)` 取得原連線設定，使用 `SqlConnection.OpenAsync(ct)` 確認可登入；成功後才初始化 schema／Respawn 與進入端點測試。暫時性連線失敗可在同一總逾時內做有界重試與短暫退避；每次連線嘗試與退避都接受共用 `CancellationToken`，失敗連線須釋放，不改連線目的地或 TLS 設定來規避握手失敗。
- readiness 逾時必須拋出點名資源並保留最後失敗原因的清楚例外。禁止無界等待與沒有就緒判斷的 `Task.Delay` 硬等；失敗後、受共用取消與總逾時約束的重試退避不屬於硬等。不得改 production / AppHost 來掩蓋 readiness 問題。
### Rule 6：Resource 名稱一致性
### Rule 7：System.Net.Http.Json
### Rule 8：ProblemDetails 驗證（使用 Satisfy<T>() 鏈式語法）
- 使用 Satisfy<T>() 驗證實際錯誤回應契約：一般 ProblemDetails 驗證 Status、Title 與該情境必要的業務錯誤內容。
- 驗證或模型繫結錯誤若回傳 ValidationProblemDetails，另驗證 Errors 非空及與該情境相關的欄位／錯誤內容；回應 DTO 必須能讀取這些欄位，不以一般 ProblemDetails 的斷言取代。
### Rule 9：移除不必要的 using
### Rule 10：測試隔離
### Rule 11：連線字串統一存取

測試 helper 需要直接存取資料庫時，**必須**透過 `App.GetConnectionStringAsync()` 取得連線字串，**不得**使用 `IConfiguration.GetConnectionString()`。

