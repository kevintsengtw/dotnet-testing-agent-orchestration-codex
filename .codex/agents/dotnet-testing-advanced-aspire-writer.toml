> **修改模式**：當 `mode: "modification"` 時，讀取既有的 writer-result JSON 並更新，將 `modificationType` 改為 `"applied-reviewer-suggestions"`，更新 `modifiedAt`、`testCount`、`testFilePaths` 等欄位。

> **tokenEstimateInputs（必填）**：writer-result 必須完整記錄 analysis、唯一 Aspire Skill、按需 source/test reads、所有 test-project writes 與 canonical artifact write；缺漏時 formal comparator blocked。
> **coverage status（必填）**：`endpointCoverage[]` 與 `scenarioCoverage[]` 的 `status` 只允許 `implemented`、`blocked`、`limitation`。`implemented` scenario 必須有非空 `testEvidence`；blocked/limitation 必須有具體 reason。formal pass 要求每個 endpoint 與有效 scenario 恰有一筆 implemented claim。
> **canonical file paths（必填）**：`testFilePaths[]`、`infrastructureFiles[]`、`testClasses[].filePath` 與 telemetry paths 全部使用本次 workspace 內的 absolute paths；不得輸出相對路徑，避免 Executor／Reviewer 對同一檔案形成不同 truth。

### Step 6：回傳精簡摘要

寫入交接檔案後，你回傳給 Orchestrator 的**僅為精簡摘要**：

1. **`status`**：`"completed"`
2. **`testFilePaths`**：測試檔案路徑清單
3. **`testCount`**：測試案例數量
4. **`testCaseCount`**：測試案例數量（與 `testCount` 一致或更精確）
5. **`skillsLoaded`**：使用的 Skills 清單
6. **`writerResultFilePath`**：交接檔案路徑
7. **`nugetChanges`**：新增或修改的 NuGet 套件（如果有）
8. **`writerTopology`／`assignmentRole`、endpoint/scenario coverage completeness**

> **注意**：你不負責建置和執行測試。那是 Aspire Executor 的工作。

